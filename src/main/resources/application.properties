spring.application.name=cv-authentication-service

# Variaveis locais (credenciais etc.) lidas do arquivo .env, se existir.
# O .env NAO e versionado; use o .env.example como modelo.
# No Railway as variaveis sao cadastradas no proprio servico.
spring.config.import=optional:file:.env[.properties]

# Banco de dados MySQL (Railway)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexoes enxuto (plano do Railway)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate (o schema e criado pelos scripts em docs/database/ddl)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (segredo obrigatorio, minimo 64 caracteres)
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Swagger / OpenAPI (springdoc) - sempre ativo
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Server Configuration (o Railway informa a porta pela variavel PORT)
server.port=${PORT:8080}
