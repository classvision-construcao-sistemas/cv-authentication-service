spring.application.name=cv-authentication-service

# Configuracao do banco de dados H2 em arquivo
spring.datasource.url=jdbc:h2:file:./data/cv-auth-db;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=minha-chave-secreta-ultra-segura-para-tokens-jwt-cv-authentication-service
jwt.expiration=3600000

# Server Configuration
server.servlet.context-path=/api
server.port=8080